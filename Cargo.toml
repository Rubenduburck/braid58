[package]
name = "braid58"
version = "0.1.0"
authors = ["Ruben du Burck"]
edition = "2024"
rust-version = "1.85"
description = "Fast fixed-width Bitcoin Base58 for 32- and 64-byte values"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rubenduburck/braid58"
homepage = "https://github.com/Rubenduburck/braid58"
documentation = "https://docs.rs/braid58"
keywords = ["base58", "encoding", "simd", "avx512"]
categories = ["encoding", "no-std"]
links = "braid58"
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/build.rs",
    "/CMakeLists.txt",
    "/Makefile",
    "/README.md",
    "/BENCHMARKS.md",
    "/DESIGN.md",
    "/bench/*.c",
    "/bench/*.patch",
    "/bench/*.sh",
    "/bench/results/*.png",
    "/cmake/*.in",
    "/docs/*.md",
    "/include/braid58.h",
    "/c/*.c",
    "/c/*.h",
    "/scripts/*.sh",
    "/src/lib.rs",
    "/tests/*.c",
]

[lib]
path = "src/lib.rs"

[features]
default = []
avx2 = []
avx512 = ["avx2"]

[build-dependencies]
cc = "1"

[package.metadata.docs.rs]
no-default-features = true

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
